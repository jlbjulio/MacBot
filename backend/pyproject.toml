[project]
name = "macbot-backend"
version = "0.3.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "langgraph>=1,<2", "python-multipart>=0.0.20,<1",
  "ddgs>=9,<10", "beautifulsoup4>=4.13,<5",
  "faster-whisper>=1.2,<2", "pypdf>=6,<7",
  "python-docx>=1.2,<2", "openpyxl>=3.1,<4", "reportlab>=4.4,<5",
  "qdrant-client[fastembed]>=1.15,<2", "pillow>=11,<13", "psutil>=7,<8",
  "sentence-transformers[image]==6.1.0", "transformers==5.19.0", "librosa>=0.11,<1", "soundfile>=0.13,<1",
  "torch==2.11.0", "torchvision==0.26.0", "diffusers==0.41.0", "accelerate>=1.1,<2",
  "piper-tts==1.8.0", "mcp==2.3.0", "langgraph-checkpoint-sqlite>=3,<5",
  "rapidocr==3.9.2", "pypdfium2==5.14.0", "python-pptx==1.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
